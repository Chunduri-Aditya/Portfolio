<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The ocellus, the eye of a peacock feather, read outward: gold ring, bronze,
    viridian, teal barbs, sapphire core. Drawn as four solid bands rather than
    a smooth gradient because the mark has to survive 16px, where an
    interpolated ring turns to mud.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b23c"/>
      <stop offset="1" stop-color="#c1743a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0a1016"/>
  <ellipse cx="32" cy="32" rx="21" ry="23" fill="url(#ring)"/>
  <ellipse cx="32" cy="32" rx="15.5" ry="17.5" fill="#22c48c"/>
  <ellipse cx="32" cy="32" rx="10.5" ry="12.5" fill="#17b3b3"/>
  <ellipse cx="32" cy="31" rx="6" ry="8" fill="#12325c"/>
  <ellipse cx="32" cy="30.5" rx="3" ry="4.5" fill="#2f8fe0"/>
</svg>
