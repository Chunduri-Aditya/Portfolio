# Workflow for deploying Vite/React app to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gates, in the order that gives the most useful failure first.
      # Nothing checked this repo before: a full pass of accessibility bugs,
      # 34 Tailwind classes that compiled to nothing, and 17 type errors all
      # shipped because build was the only step.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Palette sync
        run: npm run check:palette

      - name: Test
        run: npm run test:run

      # The answer service URL is baked in at build time. Leave the variable
      # unset and the site hides the Ask entry entirely.
      - name: Build
        run: npm run build
        env:
          VITE_PROFILE_CHAT_URL: ${{ vars.PROFILE_CHAT_URL }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
